[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

[tasks."build:tray"]
run = "cargo build --release"
dir = "tray-daemon"

[tasks."build:overlay"]
run = "cargo build --release"
dir = "overlay-daemon"

[tasks.build]
depends = ["build:tray", "build:overlay"]

[tasks."test:tray"]
run = "cargo test"
dir = "tray-daemon"

[tasks."test:overlay"]
run = "cargo test"
dir = "overlay-daemon"

[tasks.test]
depends = ["test:tray", "test:overlay"]

[tasks.lint]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."

[tasks.fmt]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
